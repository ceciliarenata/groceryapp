<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border ring -->
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#334155" stroke-width="6" opacity="0.6"/>

  <!-- Glowing background effect behind cart -->
  <circle cx="240" cy="250" r="130" fill="#3b82f6" opacity="0.18" filter="url(#glow)"/>

  <!-- Supermarket Trolley / Cart Body -->
  <g transform="translate(45, 45)">
    <!-- Cart Base Lines -->
    <path d="M 60 90 L 110 90 L 160 270 L 330 270 L 370 140 L 125 140" 
          fill="none" stroke="url(#cartGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Cart Grid Lines -->
    <path d="M 180 145 L 205 265 M 240 145 L 255 265 M 300 145 L 305 265" 
          stroke="#93c5fd" stroke-width="12" stroke-linecap="round" opacity="0.75"/>
    <path d="M 140 205 L 350 205" 
          stroke="#93c5fd" stroke-width="12" stroke-linecap="round" opacity="0.75"/>

    <!-- Trolley Wheels -->
    <circle cx="180" cy="330" r="28" fill="#1e293b" stroke="#60a5fa" stroke-width="16"/>
    <circle cx="180" cy="330" r="8" fill="#60a5fa"/>
    <circle cx="315" cy="330" r="28" fill="#1e293b" stroke="#60a5fa" stroke-width="16"/>
    <circle cx="315" cy="330" r="8" fill="#60a5fa"/>

    <!-- Safety Shield Badge (Pengendali Anggaran Safety Cap) -->
    <g transform="translate(240, 40)" filter="url(#glow)">
      <!-- Shield Shape -->
      <path d="M 80 0 L 150 24 C 150 90, 110 140, 80 156 C 50 140, 10 90, 10 24 Z" 
            fill="url(#shieldGrad)" stroke="#34d399" stroke-width="6"/>
      <!-- Shield Checkmark / Currency Rp Symbol -->
      <path d="M 50 78 L 72 100 L 115 52" 
            fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Indonesian Rupiah Sparkle -->
    <text x="75" y="75" font-family="Arial, sans-serif" font-weight="900" font-size="34" fill="#38bdf8">Rp</text>
  </g>
</svg>
