<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Offline – Smart Grocery Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #ecfdf5, #d1fae5);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,.10);
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 900; color: #0f172a; margin-bottom: 8px; }
    p { font-size: 14px; color: #64748b; line-height: 1.6; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #059669, #10b981);
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      padding: 14px 32px;
      border-radius: 999px;
      text-decoration: none;
      font-family: inherit;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(16,185,129,.4);
    }
    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📵</div>
    <h1>Sedang Offline</h1>
    <p>Tidak ada koneksi internet. Tapi tenang – data belanjaan kamu tetap tersimpan di perangkat ini!</p>
    <button class="btn" onclick="location.href='./'">🔄 Coba Lagi</button>
    <p class="note">Data akan otomatis sinkron ke cloud saat koneksi kembali</p>
  </div>
</body>
</html>
